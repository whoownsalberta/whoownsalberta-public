name: Verify public artifact

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Verify repository and artifact
        run: python3 verify_public.py
